[package]
name = "emerald-ide"
version = "0.3.0"
description = "A proof-assistant IDE for the Emerald language"
edition = "2021"
rust-version = "1.77"

[lib]
name = "emerald_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

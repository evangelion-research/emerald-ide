# Emerald IDE tasks (go-task: https://taskfile.dev). Replaces the Makefile.
#
# Vendored dependencies: raylib 6.0 (vendor/raylib), raygui v5.0
# (vendor/raygui.h, header-only), JetBrains Mono (vendor/fonts). The raylib
# static library is compiled once into vendor/raylib/src/libraylib.a.
#
#   task            build bin/emerald-ide
#   task headless   build the scripted session driver (no GUI needed)
#   task test       run the golden session tests (tests/*.script vs .expected)
#   task bless      regenerate the golden expectations
#   task run        build and run (opens the ray-tracer demo by default)
#   task clean      remove build artifacts
version: "3"

vars:
  CFLAGS: "-std=c11 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -O2 -g"
  INCLUDES: "-Ivendor/raylib/src -Ivendor"
  SRCS: "src/buffer.c src/json.c src/session.c src/ui.c"
  HEADLESS_SRCS: "headless/main.c src/buffer.c src/json.c src/session.c"
  RAYLIB_LIB: "vendor/raylib/src/libraylib.a"
  LIBS: '{{if eq OS "darwin"}}-framework Cocoa -framework IOKit -framework CoreVideo -framework OpenGL{{else}}-lGL -lm -lpthread -ldl -lX11{{end}}'

tasks:
  default:
    desc: Build bin/emerald-ide
    cmds:
      - task: build

  raylib:
    desc: Compile the vendored raylib static library (no external build system)
    internal: true
    status:
      - test -f vendor/raylib/src/libraylib.a
    cmds:
      - cd vendor/raylib/src && cc -c -O2 -std=c99 -D_GNU_SOURCE -DPLATFORM_DESKTOP_GLFW -DGRAPHICS_API_OPENGL_33 -fno-strict-aliasing -Wno-missing-braces -I. -Iexternal/glfw/include rcore.c rshapes.c rtextures.c rtext.c rmodels.c raudio.c
      - cd vendor/raylib/src && cc -x objective-c -c -O2 -std=c99 -D_GNU_SOURCE -DPLATFORM_DESKTOP_GLFW -DGRAPHICS_API_OPENGL_33 -I. -Iexternal/glfw/include rglfw.c
      - cd vendor/raylib/src && ar rcs libraylib.a rcore.o rshapes.o rtextures.o rtext.o rmodels.o raudio.o rglfw.o

  build:
    desc: Build bin/emerald-ide
    deps:
      - raylib
    cmds:
      - mkdir -p bin
      - "cc {{.CFLAGS}} {{.INCLUDES}} {{.SRCS}} {{.RAYLIB_LIB}} {{.LIBS}} -o bin/emerald-ide"

  headless:
    desc: Build the scripted session driver (no GUI needed)
    cmds:
      - mkdir -p bin
      - "cc {{.CFLAGS}} -Isrc {{.HEADLESS_SRCS}} -o bin/headless"

  # builtin.script runs with a clean environment from outside the repo so the
  # sibling emeraldc cannot be found and the built-in linter takes over
  test:
    desc: Run the golden session tests
    deps:
      - headless
    cmds:
      - |
        fail=0
        for s in tests/*.script; do
          name="${s%.script}"
          case "$s" in
            *builtin*) (cd /tmp && env -i "{{.TASKFILE_DIR}}/bin/headless" "{{.TASKFILE_DIR}}/$s") > "$name.out" 2>&1 || true ;;
            *) ./bin/headless "$s" > "$name.out" 2>&1 || true ;;
          esac
          if diff -u "$name.expected" "$name.out" > /tmp/eide_diff.$$ 2>&1; then
            echo "PASS $name"
          else
            echo "FAIL $name"
            cat /tmp/eide_diff.$$
            fail=1
          fi
          rm -f /tmp/eide_diff.$$
        done
        exit $fail

  bless:
    desc: Regenerate the golden expectations
    deps:
      - headless
    cmds:
      - |
        for s in tests/*.script; do
          name="${s%.script}"
          case "$s" in
            *builtin*) (cd /tmp && env -i "{{.TASKFILE_DIR}}/bin/headless" "{{.TASKFILE_DIR}}/$s") > "$name.expected" 2>&1 || true ;;
            *) ./bin/headless "$s" > "$name.expected" 2>&1 || true ;;
          esac
          echo "blessed $name"
        done

  run:
    desc: Build and run the IDE
    deps:
      - build
    cmds:
      - ./bin/emerald-ide

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin vendor/raylib/src/*.o vendor/raylib/src/libraylib.a

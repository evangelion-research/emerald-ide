# Emerald IDE tasks (go-task: https://taskfile.dev). Replaces the Makefile.
#
# Vendored dependencies: raylib 6.0 (vendor/raylib), raygui v5.0
# (vendor/raygui.h, header-only), JetBrains Mono (vendor/fonts). The raylib
# static library is compiled once into vendor/raylib/src/libraylib.a.
#
#   task            build bin/emerald-ide
#   task headless   build the scripted session driver (no GUI needed)
#   task test       run the golden session tests (tests/*.script vs .expected)
#   task bless      regenerate the golden expectations
#   task run        build and run (opens the ray-tracer demo by default)
#   task app        build dist/Emerald IDE.app (self-contained macOS bundle)
#   task clean      remove build artifacts
version: "3"

vars:
  CFLAGS: "-std=c11 -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -O2 -g"
  INCLUDES: "-Ivendor/raylib/src -Ivendor"
  SRCS: "src/buffer.c src/json.c src/session.c src/ui.c"
  HEADLESS_SRCS: "headless/main.c src/buffer.c src/json.c src/session.c"
  RAYLIB_LIB: "vendor/raylib/src/libraylib.a"
  LIBS: '{{if eq OS "darwin"}}-framework Cocoa -framework IOKit -framework CoreVideo -framework OpenGL{{else}}-lGL -lm -lpthread -ldl -lX11{{end}}'

tasks:
  default:
    desc: Build bin/emerald-ide
    cmds:
      - task: build

  raylib:
    desc: Compile the vendored raylib static library (no external build system)
    internal: true
    status:
      - test -f vendor/raylib/src/libraylib.a
    cmds:
      - cd vendor/raylib/src && cc -c -O2 -std=c99 -D_GNU_SOURCE -DPLATFORM_DESKTOP_GLFW -DGRAPHICS_API_OPENGL_33 -fno-strict-aliasing -Wno-missing-braces -I. -Iexternal/glfw/include rcore.c rshapes.c rtextures.c rtext.c rmodels.c raudio.c
      - cd vendor/raylib/src && cc -x objective-c -c -O2 -std=c99 -D_GNU_SOURCE -DPLATFORM_DESKTOP_GLFW -DGRAPHICS_API_OPENGL_33 -I. -Iexternal/glfw/include rglfw.c
      - cd vendor/raylib/src && ar rcs libraylib.a rcore.o rshapes.o rtextures.o rtext.o rmodels.o raudio.o rglfw.o

  build:
    desc: Build bin/emerald-ide
    deps:
      - raylib
    cmds:
      - mkdir -p bin
      - "cc {{.CFLAGS}} {{.INCLUDES}} {{.SRCS}} {{.RAYLIB_LIB}} {{.LIBS}} -o bin/emerald-ide"

  headless:
    desc: Build the scripted session driver (no GUI needed)
    cmds:
      - mkdir -p bin
      - "cc {{.CFLAGS}} -Isrc {{.HEADLESS_SRCS}} -o bin/headless"

  # builtin.script runs with a clean environment from outside the repo so the
  # sibling emeraldc cannot be found and the built-in linter takes over
  test:
    desc: Run the golden session tests
    deps:
      - headless
    cmds:
      - |
        fail=0
        for s in tests/*.script; do
          name="${s%.script}"
          case "$s" in
            *builtin*) (cd /tmp && env -i "{{.TASKFILE_DIR}}/bin/headless" "{{.TASKFILE_DIR}}/$s") > "$name.out" 2>&1 || true ;;
            *subprocess_garbage*) EMERALDC=/usr/bin/false ./bin/headless "$s" > "$name.out" 2>&1 || true ;;
            *subprocess_exec*) EMERALDC=/tmp ./bin/headless "$s" > "$name.out" 2>&1 || true ;;
            *subprocess_timeout*) chmod +x tests/fixtures/fake_slow && EMERALDC="{{.TASKFILE_DIR}}/tests/fixtures/fake_slow" EMERALD_IDE_CHECK_TIMEOUT_MS=500 ./bin/headless "$s" > "$name.out" 2>&1 || true ;;
            *) ./bin/headless "$s" > "$name.out" 2>&1 || true ;;
          esac
          if diff -u "$name.expected" "$name.out" > /tmp/eide_diff.$$ 2>&1; then
            echo "PASS $name"
          else
            echo "FAIL $name"
            cat /tmp/eide_diff.$$
            fail=1
          fi
          rm -f /tmp/eide_diff.$$
        done
        exit $fail

  bless:
    desc: Regenerate the golden expectations
    deps:
      - headless
    cmds:
      - |
        for s in tests/*.script; do
          name="${s%.script}"
          case "$s" in
            *builtin*) (cd /tmp && env -i "{{.TASKFILE_DIR}}/bin/headless" "{{.TASKFILE_DIR}}/$s") > "$name.expected" 2>&1 || true ;;
            *subprocess_garbage*) EMERALDC=/usr/bin/false ./bin/headless "$s" > "$name.expected" 2>&1 || true ;;
            *subprocess_exec*) EMERALDC=/tmp ./bin/headless "$s" > "$name.expected" 2>&1 || true ;;
            *subprocess_timeout*) chmod +x tests/fixtures/fake_slow && EMERALDC="{{.TASKFILE_DIR}}/tests/fixtures/fake_slow" EMERALD_IDE_CHECK_TIMEOUT_MS=500 ./bin/headless "$s" > "$name.expected" 2>&1 || true ;;
            *) ./bin/headless "$s" > "$name.expected" 2>&1 || true ;;
          esac
          echo "blessed $name"
        done

  run:
    desc: Build and run the IDE
    deps:
      - build
    cmds:
      - ./bin/emerald-ide

  # Assemble dist/Emerald IDE.app: the IDE binary plus the compiler and its
  # stdlib, the JetBrains Mono font, and the NERV window/Find icon. The app
  # is self-contained; the IDE finds everything relative to the bundle's
  # Contents/Resources via bundle_resources() in src/session.c.
  app:
    desc: Build dist/Emerald IDE.app (self-contained macOS bundle)
    deps:
      - build
    cmds:
      - |
        set -e
        APP="dist/Emerald IDE.app"
        RES="$APP/Contents/Resources"
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$RES/stdlib"
        cp bin/emerald-ide "$APP/Contents/MacOS/emerald-ide"
        cp ../emerald/bin/emeraldc "$APP/Contents/MacOS/emeraldc"
        cp ../emerald/stdlib/*.rald "$RES/stdlib/"
        cp vendor/fonts/JetBrainsMono-Regular.ttf "$RES/"
        cp resources/nerv.png "$RES/"
        # Finder icon: nerv.png -> .icns (all required sizes; 512@2x is an
        # upscale of the 300px source, fine for a flat logo)
        ICONSET=/tmp/nerv.iconset
        rm -rf "$ICONSET"; mkdir -p "$ICONSET"
        for s in 16 32 128 256 512; do
          d=$((s*2))
          sips -z $s $s resources/nerv.png --out "$ICONSET/icon_${s}x${s}.png" > /dev/null
          sips -z $d $d resources/nerv.png --out "$ICONSET/icon_${s}x${s}@2x.png" > /dev/null
        done
        iconutil -c icns "$ICONSET" -o "$RES/nerv.icns"
        rm -rf "$ICONSET"
        cp packaging/Info.plist "$APP/Contents/Info.plist"
        # ad-hoc signature so the bundle launches from Finder without
        # Gatekeeper complaints (arm64 requires a valid signature)
        codesign --force --deep --sign - "$APP" 2>/dev/null || true
        echo "built $APP"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin dist vendor/raylib/src/*.o vendor/raylib/src/libraylib.a
